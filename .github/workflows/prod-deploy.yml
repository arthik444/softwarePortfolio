name: Production Deployment Check

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ -d "build" ] && [ -f "build/index.html" ]; then
            echo "✅ Build output verified at ./build"
          else
            echo "❌ Build output missing"
            exit 1
          fi
